<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Experiment 3 - Dynamic To-Do List</title>
  <style>
    :root {
      --bg-1: #0a0d17;
      --bg-2: #131b31;
      --card: rgba(19, 24, 43, 0.85);
      --text: #f3f6ff;
      --muted: #9ea9c6;
      --line: rgba(255, 255, 255, 0.13);
      --brand: #3cd6ff;
      --brand-2: #7966ff;
      --danger: #ff6f8e;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: 'Segoe UI', Poppins, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #1b2a56 0, transparent 32%),
        radial-gradient(circle at 90% 0%, #36164e 0, transparent 34%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 50%, #0b1020 100%);
      display: grid;
      place-items: center;
      padding: 28px 14px;
    }

    .app {
      width: min(780px, 100%);
    }

    .hero {
      margin-bottom: 18px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(1.7rem, 4.8vw, 2.4rem);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.97rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
      backdrop-filter: blur(8px);
    }

    .task-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    .task-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .task-input:focus {
      border-color: rgba(60, 214, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(60, 214, 255, 0.2);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      color: #071421;
      background: linear-gradient(95deg, var(--brand), #79d5ff);
      box-shadow: 0 10px 22px rgba(60, 214, 255, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .stats {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .btn-secondary {
      color: #ffd7e0;
      border: 1px solid rgba(255, 111, 142, 0.5);
      background: rgba(255, 111, 142, 0.12);
      padding: 9px 13px;
      border-radius: 10px;
    }

    .btn-secondary:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .task-list {
      list-style: none;
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .task-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      transition: border-color 0.2s, transform 0.2s, opacity 0.2s;
    }

    .task-item:hover {
      border-color: rgba(60, 214, 255, 0.45);
    }

    .task-item.removing {
      opacity: 0;
      transform: translateX(8px);
    }

    .task-check {
      width: 18px;
      height: 18px;
      accent-color: var(--brand-2);
      cursor: pointer;
    }

    .task-text {
      font-size: 0.96rem;
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #9aa6c7;
    }

    .delete-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffd8df;
      background: rgba(255, 111, 142, 0.15);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.83rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .delete-btn:hover {
      border-color: rgba(255, 111, 142, 0.7);
      background: rgba(255, 111, 142, 0.25);
    }

    .empty-state {
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-align: center;
      padding: 16px;
      margin-top: 12px;
      font-size: 0.93rem;
    }

    .empty-state[hidden] {
      display: none;
    }

    @media (max-width: 620px) {
      .task-form {
        grid-template-columns: 1fr;
      }

      .btn-primary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class='app'>
    <div class='hero'>
      <h1>Experiment 3: Dynamic To-Do List</h1>
      <p>Add tasks, mark them complete, and delete tasks using JavaScript + DOM manipulation.</p>
    </div>

    <section class='card'>
      <form id='taskForm' class='task-form' autocomplete='off'>
        <input
          id='taskInput'
          class='task-input'
          type='text'
          placeholder='Enter a task and click Add Task'
          aria-label='Task input'
          required
        >
        <button type='submit' class='btn btn-primary'>Add Task</button>
      </form>

      <div class='toolbar'>
        <p id='stats' class='stats'>0 total | 0 completed | 0 pending</p>
        <button id='clearCompletedBtn' class='btn-secondary' type='button' disabled>Clear Completed</button>
      </div>

      <ul id='taskList' class='task-list' aria-live='polite'></ul>
      <p id='emptyState' class='empty-state'>No tasks yet. Add your first task above.</p>
    </section>
  </div>

  <script>
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const stats = document.getElementById('stats');
    const emptyState = document.getElementById('emptyState');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');

    function updateUiState() {
      const total = taskList.children.length;
      const completed = taskList.querySelectorAll('.task-item.completed').length;
      const pending = total - completed;

      stats.textContent = `${total} total | ${completed} completed | ${pending} pending`;
      emptyState.hidden = total !== 0;
      clearCompletedBtn.disabled = completed === 0;
    }

    function buildTaskElement(taskText) {
      const item = document.createElement('li');
      item.className = 'task-item';

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'task-check';
      check.setAttribute('aria-label', 'Mark task as completed');

      const text = document.createElement('p');
      text.className = 'task-text';
      text.textContent = taskText;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'delete-btn';
      removeBtn.textContent = 'Delete';

      item.append(check, text, removeBtn);
      return item;
    }

    taskForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const taskText = taskInput.value.trim();
      if (!taskText) {
        taskInput.focus();
        return;
      }

      const item = buildTaskElement(taskText);
      taskList.prepend(item);

      taskInput.value = '';
      taskInput.focus();
      updateUiState();
    });

    taskList.addEventListener('change', function (event) {
      if (!event.target.classList.contains('task-check')) {
        return;
      }

      const item = event.target.closest('.task-item');
      item.classList.toggle('completed', event.target.checked);
      updateUiState();
    });

    taskList.addEventListener('click', function (event) {
      if (!event.target.classList.contains('delete-btn')) {
        return;
      }

      const item = event.target.closest('.task-item');
      item.classList.add('removing');

      setTimeout(function () {
        item.remove();
        updateUiState();
      }, 180);
    });

    clearCompletedBtn.addEventListener('click', function () {
      const completedItems = taskList.querySelectorAll('.task-item.completed');
      completedItems.forEach(function (item) {
        item.remove();
      });
      updateUiState();
    });

    updateUiState();
  </script>
</body>
</html>
