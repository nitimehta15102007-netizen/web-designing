<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Experiment 3 - Dynamic To-Do List</title>
  <style>
    :root{--bg:#0b1021;--bg2:#131d3a;--card:rgba(19,27,51,.85);--line:rgba(255,255,255,.15);--txt:#eef3ff;--muted:#9dafd5;--a:#41d7ff;--b:#7a67ff;--danger:#ff6f90}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--txt);font:16px/1.5 'Segoe UI',sans-serif;background:radial-gradient(circle at 15% 12%,#1c2d5b 0,transparent 35%),radial-gradient(circle at 90% 0,#391d56 0,transparent 35%),linear-gradient(145deg,var(--bg),var(--bg2));}
    .app{width:min(760px,100%)}
    h1{font-size:clamp(1.5rem,4vw,2.2rem);margin-bottom:6px}.sub{color:var(--muted);margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 18px 44px rgba(0,0,0,.32)}
    form{display:grid;grid-template-columns:1fr auto;gap:9px}
    input{padding:11px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.04);color:var(--txt);font:inherit}
    input:focus{outline:none;border-color:rgba(65,215,255,.8);box-shadow:0 0 0 3px rgba(65,215,255,.2)}
    button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
    .add{background:linear-gradient(95deg,var(--a),#8ad7ff);color:#061521}
    .tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px;margin:12px 0 8px}
    .stats{font-size:.92rem;color:var(--muted)}
    .clear{border:1px solid rgba(255,111,144,.55);background:rgba(255,111,144,.14);color:#ffd8df;padding:8px 11px}
    ul{list-style:none;display:grid;gap:8px}
    li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px}
    .done .txt{text-decoration:line-through;color:#97a7cb}
    .txt{word-break:break-word}
    .del{border:1px solid rgba(255,111,144,.58);background:rgba(255,111,144,.14);color:#ffd8df;padding:6px 9px;border-radius:9px}
    .empty{margin-top:10px;padding:14px;text-align:center;border:1px dashed rgba(255,255,255,.24);border-radius:12px;color:var(--muted)}
    .empty[hidden]{display:none}
    @media (max-width:620px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class='app'>
    <h1>Experiment 3: Dynamic To-Do List</h1>
    <p class='sub'>Add, complete, and delete tasks using JavaScript DOM manipulation.</p>

    <section class='card'>
      <form id='taskForm' autocomplete='off'>
        <input id='taskInput' type='text' placeholder='Enter task' required aria-label='Task input'>
        <button class='add' type='submit'>Add Task</button>
      </form>

      <div class='tools'>
        <p class='stats' id='stats'>0 total | 0 completed | 0 pending</p>
        <button id='clearBtn' class='clear' type='button' disabled>Clear Completed</button>
      </div>

      <ul id='list' aria-live='polite'></ul>
      <p id='empty' class='empty'>No tasks yet. Add your first task.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('taskForm');
    const input = document.getElementById('taskInput');
    const list = document.getElementById('list');
    const stats = document.getElementById('stats');
    const empty = document.getElementById('empty');
    const clearBtn = document.getElementById('clearBtn');

    const stat = () => {
      const total = list.children.length;
      const done = list.querySelectorAll('.done').length;
      stats.textContent = `${total} total | ${done} completed | ${total - done} pending`;
      empty.hidden = total > 0;
      clearBtn.disabled = done === 0;
    };

    const row = (text) => {
      const li = document.createElement('li');
      li.innerHTML = `<input type='checkbox' aria-label='Mark complete'><p class='txt'></p><button class='del' type='button'>Delete</button>`;
      li.querySelector('.txt').textContent = text;
      return li;
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return input.focus();
      list.prepend(row(text));
      input.value = '';
      input.focus();
      stat();
    });

    list.addEventListener('change', (e) => {
      if (e.target.type !== 'checkbox') return;
      e.target.closest('li').classList.toggle('done', e.target.checked);
      stat();
    });

    list.addEventListener('click', (e) => {
      if (!e.target.classList.contains('del')) return;
      e.target.closest('li').remove();
      stat();
    });

    clearBtn.addEventListener('click', () => {
      list.querySelectorAll('.done').forEach((item) => item.remove());
      stat();
    });

    stat();
  </script>
</body>
</html>
