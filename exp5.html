<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Experiment 5 - Weather App</title>
  <style>
    :root{--bg:#0b1020;--bg2:#121c38;--card:rgba(16,24,47,.88);--soft:rgba(255,255,255,.04);--line:rgba(255,255,255,.14);--txt:#eef4ff;--muted:#9fb0d6;--a:#3f84ff;--danger:#ff7f96}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;padding:16px;font:16px/1.45 Arial,sans-serif;color:var(--txt);background:radial-gradient(circle at 16% 11%,#1d2c5a 0,transparent 35%),radial-gradient(circle at 86% 0,#351a4f 0,transparent 33%),linear-gradient(145deg,var(--bg),var(--bg2))}
    .app{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 22px 48px rgba(0,0,0,.32);backdrop-filter:blur(8px)}
    .chip{display:inline-block;font-size:.76rem;padding:4px 10px;border-radius:999px;border:1px solid rgba(123,173,255,.45);background:rgba(63,132,255,.2);margin-bottom:10px}
    h1{font-size:1.45rem;margin-bottom:5px}.sub{font-size:.92rem;color:var(--muted);margin-bottom:12px}
    form{display:flex;gap:8px;margin-bottom:10px}input,select{width:100%;padding:10px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--txt);font:inherit}
    input::placeholder{color:#8fa3ce}
    input:focus,select:focus,button:focus-visible{outline:none;border-color:rgba(63,132,255,.85);box-shadow:0 0 0 3px rgba(63,132,255,.2)}
    button{padding:10px 14px;border-radius:10px;border:1px solid var(--a);background:var(--a);color:#fff;font-weight:600;cursor:pointer}
    button:disabled{opacity:.7;cursor:not-allowed}
    .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .tools label{font-size:.82rem;color:var(--muted)}
    .tools select{width:auto;padding:7px 10px;font-size:.85rem}
    .map{display:none;color:#96c5ff;text-decoration:none;border-bottom:1px dashed rgba(150,197,255,.6);font-size:.84rem}
    .map.show{display:inline-block}
    .status{min-height:22px;font-size:.9rem;color:#c8d7f7;margin-bottom:8px}
    .status.error{color:var(--danger)}
    .box{display:none;border:1px solid var(--line);border-radius:13px;background:var(--soft);padding:13px;margin-bottom:8px}
    .box.show{display:block}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .place{font-weight:700}.cond{font-size:.9rem;color:#9eb1db}.icon{font-size:1.45rem}
    .temp{font-size:2rem;font-weight:700;margin:8px 0 10px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .k{border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px;background:rgba(255,255,255,.03)}
    .k small{color:#9db0db;display:block;font-size:.75rem}.k b{font-size:.95rem}
    .list{display:grid;gap:7px}
    .hours{grid-template-columns:repeat(3,1fr)}
    .item{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);border-radius:10px;padding:8px;text-align:center}
    .item small{display:block;color:#9eb0d7;margin-bottom:3px}
    .week .item{display:flex;justify-content:space-between;align-items:center;text-align:left}
    .note{font-size:.8rem;color:#94a8d2;margin-top:2px}
    @media (max-width:620px){form{flex-direction:column}.hours{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.week .item{flex-direction:column;align-items:flex-start;gap:4px}}
  </style>
</head>
<body>
  <main class='app'>
    <span class='chip'>Experiment 5</span>
    <h1>Weather App</h1>
    <p class='sub'>Check live weather by city with hourly and weekly forecast.</p>

    <form id='weatherForm' autocomplete='off'>
      <input id='city' type='text' placeholder='Enter city name' required>
      <button id='searchBtn' type='submit'>Search</button>
    </form>

    <div class='tools'>
      <label for='refresh'>Auto refresh:</label>
      <select id='refresh'>
        <option value='0'>Off</option>
        <option value='15'>Every 15 min</option>
        <option value='30'>Every 30 min</option>
        <option value='60' selected>Every 1 hour</option>
      </select>
      <a id='map' class='map' href='#' target='_blank' rel='noopener'>Open in Google Maps</a>
    </div>

    <p id='status' class='status'></p>

    <section id='currentBox' class='box'>
      <div class='top'>
        <div><p id='place' class='place'></p><p id='cond' class='cond'></p></div>
        <p id='icon' class='icon'>-</p>
      </div>
      <p id='temp' class='temp'>-</p>
      <div class='grid'>
        <div class='k'><small>Humidity</small><b id='humidity'>-</b></div>
        <div class='k'><small>Wind</small><b id='wind'>-</b></div>
        <div class='k'><small>Feels Like</small><b id='feels'>-</b></div>
      </div>
    </section>

    <section id='hourBox' class='box'>
      <h2 style='font-size:1rem;margin-bottom:7px'>Next 6 Hours</h2>
      <div id='hours' class='list hours'></div>
    </section>

    <section id='weekBox' class='box week'>
      <h2 style='font-size:1rem;margin-bottom:7px'>Next 5 Days</h2>
      <div id='week' class='list'></div>
    </section>

    <p class='note'>Data source: Open-Meteo API.</p>
  </main>

  <script>
    const form = document.getElementById('weatherForm');
    const city = document.getElementById('city');
    const searchBtn = document.getElementById('searchBtn');
    const refresh = document.getElementById('refresh');
    const map = document.getElementById('map');
    const status = document.getElementById('status');
    const currentBox = document.getElementById('currentBox');
    const hourBox = document.getElementById('hourBox');
    const weekBox = document.getElementById('weekBox');
    const place = document.getElementById('place');
    const cond = document.getElementById('cond');
    const icon = document.getElementById('icon');
    const temp = document.getElementById('temp');
    const humidity = document.getElementById('humidity');
    const wind = document.getElementById('wind');
    const feels = document.getElementById('feels');
    const hours = document.getElementById('hours');
    const week = document.getElementById('week');

    const codeText = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorm'};
    const codeIcon = c => c===0?'Sun':(c<=3?'Cloud':([61,63,65,80,81,82,51,53,55].includes(c)?'Rain':([71,73,75].includes(c)?'Snow':'Wind')));
    let timer = null, activeLoc = null;

    const setStatus = (msg, err=false) => {status.textContent = msg; status.className = err ? 'status error' : 'status';};
    const loading = on => {searchBtn.disabled = on; searchBtn.textContent = on ? 'Loading...' : 'Search';};
    const hidePanels = () => [currentBox,hourBox,weekBox].forEach(x => x.classList.remove('show'));

    function setMap(lat, lon){ map.href = `https://www.google.com/maps?q=${lat},${lon}`; map.classList.add('show'); }
    function when(t){ return (t.split('T')[1] || t).slice(0,5); }
    function day(d){ return new Date(d).toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'}); }

    async function geocode(name){
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`);
      if(!r.ok) throw new Error('Unable to find location.');
      const j = await r.json();
      if(!j.results?.length) throw new Error('City not found. Try another name.');
      const x = j.results[0];
      return {name:x.name,country:x.country||'',latitude:x.latitude,longitude:x.longitude};
    }

    async function weather(lat, lon){
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto`;
      const r = await fetch(url);
      if(!r.ok) throw new Error('Could not fetch weather data.');
      return r.json();
    }

    function renderHourly(h, now){
      hours.innerHTML = '';
      if(!h?.time?.length) return hourBox.classList.remove('show');
      const start = Math.max(h.time.indexOf(now), 0);
      h.time.slice(start, start + 6).forEach((time, i) => {
        const idx = start + i;
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `<small>${when(time)}</small><b>${h.temperature_2m[idx]} C</b><small>${codeIcon(h.weather_code[idx])}</small>`;
        hours.appendChild(el);
      });
      hourBox.classList.toggle('show', hours.children.length > 0);
    }

    function renderWeekly(d){
      week.innerHTML = '';
      if(!d?.time?.length) return weekBox.classList.remove('show');
      d.time.slice(0,5).forEach((date, i) => {
        const el = document.createElement('div');
        el.className = 'item';
        const c = d.weather_code[i];
        el.innerHTML = `<div><b>${day(date)}</b><br><small>${codeText[c] || 'Weather'}</small></div><div><small>${codeIcon(c)}</small><br><b>${d.temperature_2m_min[i]} / ${d.temperature_2m_max[i]} C</b></div>`;
        week.appendChild(el);
      });
      weekBox.classList.toggle('show', week.children.length > 0);
    }

    function resetTimer(){ if(timer){ clearInterval(timer); timer = null; } }
    function applyAuto(){
      resetTimer();
      const min = Number(refresh.value);
      if(!activeLoc || min <= 0) return;
      timer = setInterval(() => loadWeather(activeLoc, true), min * 60 * 1000);
    }

    async function loadWeather(loc, auto=false){
      try{
        loading(true);
        if(!auto) setStatus('Loading weather...');
        const data = await weather(loc.latitude, loc.longitude);
        const c = data.current;
        place.textContent = `${loc.name}${loc.country ? ', ' + loc.country : ''}`;
        cond.textContent = codeText[c.weather_code] || 'Not available';
        icon.textContent = codeIcon(c.weather_code);
        temp.textContent = `${c.temperature_2m} C`;
        humidity.textContent = `${c.relative_humidity_2m}%`;
        wind.textContent = `${c.wind_speed_10m} km/h`;
        feels.textContent = `${c.apparent_temperature} C`;

        renderHourly(data.hourly, c.time);
        renderWeekly(data.daily);
        currentBox.classList.add('show');
        setMap(loc.latitude, loc.longitude);
        const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        setStatus(auto ? `Auto refreshed at ${now}` : `Updated at ${now}`);
        activeLoc = loc;
        applyAuto();
      }catch(err){
        hidePanels();
        map.classList.remove('show');
        setStatus(err.message || 'Something went wrong.', true);
      }finally{ loading(false); }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = city.value.trim();
      if(!name) return setStatus('Please enter a city name.', true);
      try{ const loc = await geocode(name); await loadWeather(loc); }
      catch(err){ hidePanels(); map.classList.remove('show'); setStatus(err.message, true); }
    });

    refresh.addEventListener('change', () => {
      applyAuto();
      const min = Number(refresh.value);
      setStatus(min ? `Auto refresh set to every ${min === 60 ? '1 hour' : min + ' minutes'}.` : 'Auto refresh turned off.');
    });
  </script>
</body>
</html>
