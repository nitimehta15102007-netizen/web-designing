<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='description' content='Experiment 7 - React single-page notes app with create, update, delete, and search functionality.'>
  <title>Experiment 7 - React Notes App</title>

  <script crossorigin src='https://unpkg.com/react@18/umd/react.development.js'></script>
  <script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script>
  <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>

  <style>
    :root {
      --bg-a: #0b1022;
      --bg-b: #121c3a;
      --card: rgba(18, 28, 54, 0.88);
      --soft: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.14);
      --text: #eef3ff;
      --muted: #9db0d8;
      --brand: #4f8cff;
      --brand-hover: #3d75de;
      --accent: #6f5cff;
      --danger: #ff6f86;
      --ok: #64d193;
      --shadow: 0 22px 45px rgba(0, 0, 0, 0.34);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, #203262 0, transparent 36%),
        radial-gradient(circle at 92% 0, #382056 0, transparent 34%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
      padding: 20px;
    }

    .app {
      width: min(1200px, 96%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .title h1 {
      font-size: clamp(1.35rem, 3.1vw, 2rem);
      letter-spacing: 0.2px;
      margin-bottom: 4px;
    }

    .title p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      color: #d6e4ff;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(7px);
      padding: 16px;
    }

    .panel h2 {
      font-size: 1.08rem;
      margin-bottom: 10px;
    }

    .muted {
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      color: #dce8ff;
    }

    .form-row {
      margin-bottom: 12px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font: inherit;
      padding: 10px 11px;
    }

    textarea {
      min-height: 124px;
      resize: vertical;
      line-height: 1.45;
    }

    input::placeholder,
    textarea::placeholder {
      color: #90a5d0;
    }

    input:focus,
    textarea:focus,
    select:focus,
    button:focus-visible {
      outline: none;
      border-color: rgba(79, 140, 255, 0.85);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.2);
    }

    .count {
      margin-top: 4px;
      text-align: right;
      font-size: 0.8rem;
      color: #9fb4df;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(95deg, var(--brand), var(--accent));
      color: #fff;
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.18);
      color: #dce8ff;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-danger {
      background: rgba(255, 111, 134, 0.15);
      border-color: rgba(255, 111, 134, 0.55);
      color: #ffd9df;
    }

    .btn-danger:hover {
      background: rgba(255, 111, 134, 0.24);
    }

    .error {
      margin-top: 8px;
      color: #ffc5d0;
      font-size: 0.86rem;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }

    .note-list {
      display: grid;
      gap: 10px;
    }

    .note-card {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      padding: 12px;
      transition: transform 0.18s ease;
    }

    .note-card:hover {
      transform: translateY(-2px);
    }

    .note-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
      margin-bottom: 7px;
    }

    .note-title-wrap h3 {
      font-size: 1rem;
      margin-bottom: 3px;
    }

    .meta {
      font-size: 0.78rem;
      color: #94a8d3;
    }

    .tag-row {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(138, 177, 255, 0.35);
      color: #d9e7ff;
      background: rgba(89, 142, 255, 0.18);
      border-radius: 999px;
      font-size: 0.74rem;
      padding: 4px 10px;
      letter-spacing: 0.2px;
    }

    .pin {
      border: 1px solid rgba(100, 209, 147, 0.55);
      background: rgba(100, 209, 147, 0.14);
      color: #d8ffe8;
      border-radius: 999px;
      font-size: 0.72rem;
      padding: 4px 9px;
    }

    .note-content {
      color: #d8e5ff;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 0.93rem;
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: #ebf2ff;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .small-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .small-btn.warn {
      border-color: rgba(255, 111, 134, 0.58);
      color: #ffd6dd;
      background: rgba(255, 111, 134, 0.14);
    }

    .empty {
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      text-align: center;
      padding: 30px 16px;
      color: #a8badf;
      background: rgba(255, 255, 255, 0.02);
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 850px) {
      .filters {
        grid-template-columns: 1fr;
      }

      body {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div id='root'></div>

  <script type='text/babel'>
    const { useEffect, useMemo, useState } = React;

    const STORAGE_KEY = 'exp7_notes_app_v1';

    const starterNotes = [
      {
        id: 'n1',
        title: 'Prepare DBMS assignment',
        category: 'College',
        content: 'Finalize ER diagram and revise normalization examples before Monday.',
        pinned: true,
        createdAt: '2026-10-18T10:20:00',
        updatedAt: '2026-10-18T10:20:00'
      },
      {
        id: 'n2',
        title: 'Practice React forms',
        category: 'Coding',
        content: 'Build one mini CRUD form and revise controlled components and hooks.',
        pinned: false,
        createdAt: '2026-10-20T17:45:00',
        updatedAt: '2026-10-20T17:45:00'
      }
    ];

    function formatDate(value) {
      const date = new Date(value);
      return date.toLocaleString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function loadNotes() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          return starterNotes;
        }

        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          return parsed;
        }

        return starterNotes;
      } catch (error) {
        return starterNotes;
      }
    }

    function App() {
      const [notes, setNotes] = useState(loadNotes);
      const [query, setQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [sortBy, setSortBy] = useState('newest');
      const [editingId, setEditingId] = useState(null);
      const [formError, setFormError] = useState('');
      const [form, setForm] = useState({
        title: '',
        category: 'General',
        content: ''
      });

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }, [notes]);

      const categories = useMemo(() => {
        const unique = [...new Set(notes.map((note) => note.category).filter(Boolean))];
        return unique.sort((a, b) => a.localeCompare(b));
      }, [notes]);

      const filteredNotes = useMemo(() => {
        const normalized = query.trim().toLowerCase();

        const result = notes.filter((note) => {
          const matchesSearch =
            !normalized ||
            note.title.toLowerCase().includes(normalized) ||
            note.content.toLowerCase().includes(normalized) ||
            note.category.toLowerCase().includes(normalized);

          const matchesCategory = categoryFilter === 'All' || note.category === categoryFilter;
          return matchesSearch && matchesCategory;
        });

        const sorted = [...result].sort((a, b) => {
          if (a.pinned !== b.pinned) {
            return a.pinned ? -1 : 1;
          }

          if (sortBy === 'oldest') {
            return new Date(a.createdAt) - new Date(b.createdAt);
          }

          if (sortBy === 'az') {
            return a.title.localeCompare(b.title);
          }

          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        return sorted;
      }, [notes, query, categoryFilter, sortBy]);

      const pinnedCount = notes.filter((note) => note.pinned).length;
      const isEditing = editingId !== null;

      function handleChange(event) {
        const { name, value } = event.target;
        setForm((prev) => ({ ...prev, [name]: value }));
      }

      function resetForm() {
        setForm({ title: '', category: 'General', content: '' });
        setEditingId(null);
        setFormError('');
      }

      function handleSubmit(event) {
        event.preventDefault();

        const title = form.title.trim();
        const content = form.content.trim();
        const category = form.category.trim() || 'General';

        if (!title || !content) {
          setFormError('Please enter both title and note content.');
          return;
        }

        const now = new Date().toISOString();

        if (editingId) {
          setNotes((prev) =>
            prev.map((note) =>
              note.id === editingId
                ? {
                    ...note,
                    title,
                    category,
                    content,
                    updatedAt: now
                  }
                : note
            )
          );
        } else {
          const id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now());

          setNotes((prev) => [
            {
              id,
              title,
              category,
              content,
              pinned: false,
              createdAt: now,
              updatedAt: now
            },
            ...prev
          ]);
        }

        resetForm();
      }

      function startEdit(note) {
        setEditingId(note.id);
        setForm({
          title: note.title,
          category: note.category,
          content: note.content
        });
        setFormError('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function togglePin(id) {
        setNotes((prev) =>
          prev.map((note) =>
            note.id === id
              ? {
                  ...note,
                  pinned: !note.pinned,
                  updatedAt: new Date().toISOString()
                }
              : note
          )
        );
      }

      function deleteNote(id) {
        const ask = confirm('Delete this note?');
        if (!ask) {
          return;
        }

        setNotes((prev) => prev.filter((note) => note.id !== id));

        if (editingId === id) {
          resetForm();
        }
      }

      function clearAll() {
        if (!notes.length) {
          return;
        }

        const ask = confirm('Remove all notes? This cannot be undone.');
        if (!ask) {
          return;
        }

        setNotes([]);
        resetForm();
      }

      return (
        <div className='app'>
          <header className='topbar'>
            <div className='title'>
              <h1>Experiment 7 • React Notes Studio</h1>
              <p>Single-page notes app with add, update, delete, search, and pin support.</p>
            </div>

            <div className='stats'>
              <span className='chip'>Total Notes: {notes.length}</span>
              <span className='chip'>Pinned: {pinnedCount}</span>
              <span className='chip'>Visible: {filteredNotes.length}</span>
            </div>
          </header>

          <div className='layout'>
            <section className='panel'>
              <h2>{isEditing ? 'Update Note' : 'Create Note'}</h2>
              <p className='muted' style={{ marginBottom: '12px' }}>
                Keep your class tasks, revision points, and project ideas organized.
              </p>

              <form onSubmit={handleSubmit}>
                <div className='form-row'>
                  <label htmlFor='title'>Title</label>
                  <input
                    id='title'
                    name='title'
                    value={form.title}
                    onChange={handleChange}
                    placeholder='Example: Revise statistics unit'
                    maxLength={80}
                  />
                </div>

                <div className='form-row'>
                  <label htmlFor='category'>Category</label>
                  <input
                    id='category'
                    name='category'
                    value={form.category}
                    onChange={handleChange}
                    placeholder='Example: College / Personal / Coding'
                    maxLength={24}
                  />
                </div>

                <div className='form-row'>
                  <label htmlFor='content'>Note</label>
                  <textarea
                    id='content'
                    name='content'
                    value={form.content}
                    onChange={handleChange}
                    placeholder='Write the full note here...'
                    maxLength={1000}
                  ></textarea>
                  <div className='count'>{form.content.length}/1000</div>
                </div>

                <div className='button-row'>
                  <button className='btn btn-primary' type='submit'>
                    {isEditing ? 'Save Changes' : 'Add Note'}
                  </button>

                  {isEditing && (
                    <button className='btn btn-secondary' type='button' onClick={resetForm}>
                      Cancel Edit
                    </button>
                  )}
                </div>

                {formError && <p className='error'>{formError}</p>}
              </form>
            </section>

            <section className='panel'>
              <div className='filters'>
                <div>
                  <label htmlFor='search'>Search</label>
                  <input
                    id='search'
                    value={query}
                    onChange={(event) => setQuery(event.target.value)}
                    placeholder='Search by title, text, or category'
                  />
                </div>

                <div>
                  <label htmlFor='categoryFilter'>Category</label>
                  <select
                    id='categoryFilter'
                    value={categoryFilter}
                    onChange={(event) => setCategoryFilter(event.target.value)}
                  >
                    <option value='All'>All</option>
                    {categories.map((category) => (
                      <option key={category} value={category}>
                        {category}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label htmlFor='sortBy'>Sort</label>
                  <select
                    id='sortBy'
                    value={sortBy}
                    onChange={(event) => setSortBy(event.target.value)}
                  >
                    <option value='newest'>Newest</option>
                    <option value='oldest'>Oldest</option>
                    <option value='az'>A to Z</option>
                  </select>
                </div>

                <button className='btn btn-danger' type='button' onClick={clearAll}>
                  Clear All
                </button>
              </div>

              <div className='note-list'>
                {filteredNotes.length === 0 ? (
                  <div className='empty'>
                    <p>No notes found for this filter.</p>
                  </div>
                ) : (
                  filteredNotes.map((note) => (
                    <article className='note-card' key={note.id}>
                      <div className='note-head'>
                        <div className='note-title-wrap'>
                          <h3>{note.title}</h3>
                          <p className='meta'>Created: {formatDate(note.createdAt)}</p>
                          {note.updatedAt !== note.createdAt && (
                            <p className='meta'>Updated: {formatDate(note.updatedAt)}</p>
                          )}
                        </div>
                      </div>

                      <div className='tag-row'>
                        <span className='tag'>{note.category}</span>
                        {note.pinned && <span className='pin'>Pinned</span>}
                      </div>

                      <p className='note-content'>{note.content}</p>

                      <div className='card-actions'>
                        <button className='small-btn' onClick={() => startEdit(note)}>
                          Edit
                        </button>
                        <button className='small-btn' onClick={() => togglePin(note.id)}>
                          {note.pinned ? 'Unpin' : 'Pin'}
                        </button>
                        <button className='small-btn warn' onClick={() => deleteNote(note.id)}>
                          Delete
                        </button>
                      </div>
                    </article>
                  ))
                )}
              </div>
            </section>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
