<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='description' content='Experiment 7 React notes app with create, update, delete, search and filters'>
  <title>Experiment 7 - React Notes App</title>
  <script crossorigin src='https://unpkg.com/react@18/umd/react.development.js'></script>
  <script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script>
  <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
  <style>
    :root{--bg:#0b1020;--bg2:#121c3b;--card:rgba(17,26,52,.86);--line:rgba(255,255,255,.14);--txt:#eef4ff;--muted:#a5b6db;--a:#4c8cff;--b:#705fff;--danger:#ff728e}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:16px/1.45 'Segoe UI',sans-serif;color:var(--txt);min-height:100vh;padding:18px;background:radial-gradient(circle at 15% 10%,#1f2f60 0,transparent 36%),radial-gradient(circle at 90% 0,#381f59 0,transparent 34%),linear-gradient(145deg,var(--bg),var(--bg2))}
    .app{width:min(1120px,96%);margin:auto}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
    h1{font-size:clamp(1.4rem,3.1vw,2rem)}
    .sub{color:var(--muted);font-size:.94rem}
    .stats{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:.82rem}
    .layout{display:grid;grid-template-columns:350px 1fr;gap:14px;align-items:start}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.3)}
    .panel h2{font-size:1.05rem;margin-bottom:8px}.muted{color:var(--muted);font-size:.9rem;margin-bottom:10px}
    .field{margin-bottom:10px} label{display:block;font-size:.84rem;font-weight:600;margin-bottom:5px;color:#dce8ff}
    input,textarea,select{width:100%;padding:10px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--txt);font:inherit}
    textarea{min-height:110px;resize:vertical}
    input::placeholder,textarea::placeholder{color:#8ea4d0}
    input:focus,textarea:focus,select:focus,button:focus-visible{outline:none;border-color:rgba(76,140,255,.85);box-shadow:0 0 0 3px rgba(76,140,255,.2)}
    .count{text-align:right;font-size:.78rem;color:#9cb1da;margin-top:4px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid transparent;border-radius:10px;padding:9px 13px;font-size:.88rem;font-weight:600;cursor:pointer}
    .btn-main{background:linear-gradient(95deg,var(--a),var(--b));color:#fff}
    .btn-soft{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#dbe8ff}
    .btn-danger{background:rgba(255,114,142,.15);border-color:rgba(255,114,142,.56);color:#ffd8df}
    .err{margin-top:8px;font-size:.86rem;color:#ffc8d4}
    .filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:9px;align-items:end;margin-bottom:12px}
    .list{display:grid;gap:9px}
    .note{border:1px solid var(--line);border-radius:13px;padding:11px;background:rgba(255,255,255,.03)}
    .note-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .note h3{font-size:1rem;margin-bottom:3px}.meta{font-size:.78rem;color:#96a8d2}
    .tags{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
    .tag{font-size:.74rem;padding:4px 9px;border-radius:999px;border:1px solid rgba(128,171,255,.45);background:rgba(95,147,255,.2)}
    .pin{font-size:.74rem;padding:4px 9px;border-radius:999px;border:1px solid rgba(102,211,154,.55);background:rgba(102,211,154,.14)}
    .content{white-space:pre-wrap;color:#d9e5ff;font-size:.92rem;margin-bottom:9px}
    .small{padding:6px 10px;font-size:.8rem;border-radius:9px}
    .empty{text-align:center;color:#a7b9df;border:1px dashed rgba(255,255,255,.26);padding:24px;border-radius:12px;background:rgba(255,255,255,.02)}
    @media (max-width:980px){.layout{grid-template-columns:1fr}}
    @media (max-width:780px){.filters{grid-template-columns:1fr}body{padding:14px}}
  </style>
</head>
<body>
  <div id='root'></div>

  <script type='text/babel'>
    const { useEffect, useMemo, useState } = React;
    const KEY = 'exp7_notes_v2';

    const seed = [
      { id: '1', title: 'Prepare DBMS assignment', category: 'College', content: 'Complete ER diagram and revise normalization examples.', pinned: true, createdAt: '2026-11-12T10:20:00', updatedAt: '2026-11-12T10:20:00' },
      { id: '2', title: 'Practice React forms', category: 'Coding', content: 'Build a small CRUD form using controlled components.', pinned: false, createdAt: '2026-11-13T16:40:00', updatedAt: '2026-11-13T16:40:00' }
    ];

    const load = () => {
      try {
        const data = JSON.parse(localStorage.getItem(KEY));
        return Array.isArray(data) ? data : seed;
      } catch { return seed; }
    };

    const fmt = (v) => new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    function App() {
      const [notes, setNotes] = useState(load);
      const [query, setQuery] = useState('');
      const [filter, setFilter] = useState('All');
      const [sort, setSort] = useState('newest');
      const [editing, setEditing] = useState(null);
      const [error, setError] = useState('');
      const [form, setForm] = useState({ title: '', category: 'General', content: '' });

      useEffect(() => localStorage.setItem(KEY, JSON.stringify(notes)), [notes]);

      const categories = useMemo(() => ['All', ...new Set(notes.map(x => x.category))], [notes]);

      const visible = useMemo(() => {
        const q = query.trim().toLowerCase();
        return [...notes]
          .filter((n) => {
            const hit = !q || [n.title, n.category, n.content].join(' ').toLowerCase().includes(q);
            const cat = filter === 'All' || n.category === filter;
            return hit && cat;
          })
          .sort((a, b) => {
            if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
            if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
            if (sort === 'az') return a.title.localeCompare(b.title);
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
      }, [notes, query, filter, sort]);

      const pinned = notes.filter(n => n.pinned).length;
      const isEdit = editing !== null;

      const reset = () => {
        setForm({ title: '', category: 'General', content: '' });
        setEditing(null);
        setError('');
      };

      const submit = (e) => {
        e.preventDefault();
        const title = form.title.trim();
        const category = form.category.trim() || 'General';
        const content = form.content.trim();
        if (!title || !content) return setError('Title and note content are required.');

        const now = new Date().toISOString();
        if (isEdit) {
          setNotes((list) => list.map((n) => n.id === editing ? { ...n, title, category, content, updatedAt: now } : n));
        } else {
          const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
          setNotes((list) => [{ id, title, category, content, pinned: false, createdAt: now, updatedAt: now }, ...list]);
        }
        reset();
      };

      const edit = (n) => {
        setEditing(n.id);
        setForm({ title: n.title, category: n.category, content: n.content });
        setError('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const remove = (id) => {
        if (!confirm('Delete this note?')) return;
        setNotes((list) => list.filter((n) => n.id !== id));
        if (editing === id) reset();
      };

      const togglePin = (id) => setNotes((list) => list.map((n) => n.id === id ? { ...n, pinned: !n.pinned, updatedAt: new Date().toISOString() } : n));

      const clearAll = () => {
        if (!notes.length || !confirm('Remove all notes?')) return;
        setNotes([]);
        reset();
      };

      return (
        <div className='app'>
          <header className='top'>
            <div>
              <h1>Experiment 7 - React Notes Studio</h1>
              <p className='sub'>Single-page notes app with add, update, delete, search, pin, and filter.</p>
            </div>
            <div className='stats'>
              <span className='chip'>Total: {notes.length}</span>
              <span className='chip'>Pinned: {pinned}</span>
              <span className='chip'>Visible: {visible.length}</span>
            </div>
          </header>

          <div className='layout'>
            <section className='panel'>
              <h2>{isEdit ? 'Update Note' : 'Create Note'}</h2>
              <p className='muted'>Store class tasks, revision points, and project ideas.</p>

              <form onSubmit={submit}>
                <div className='field'><label htmlFor='title'>Title</label><input id='title' maxLength='80' value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder='Example: Revise statistics unit' /></div>
                <div className='field'><label htmlFor='category'>Category</label><input id='category' maxLength='24' value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} placeholder='College / Coding / Personal' /></div>
                <div className='field'><label htmlFor='content'>Note</label><textarea id='content' maxLength='1000' value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} placeholder='Write note details here...' /><div className='count'>{form.content.length}/1000</div></div>
                <div className='row'>
                  <button className='btn-main' type='submit'>{isEdit ? 'Save Changes' : 'Add Note'}</button>
                  {isEdit && <button className='btn-soft' type='button' onClick={reset}>Cancel Edit</button>}
                </div>
                {error && <p className='err'>{error}</p>}
              </form>
            </section>

            <section className='panel'>
              <div className='filters'>
                <div className='field'><label htmlFor='search'>Search</label><input id='search' value={query} onChange={(e) => setQuery(e.target.value)} placeholder='Search by title, text, category' /></div>
                <div className='field'><label htmlFor='filter'>Category</label><select id='filter' value={filter} onChange={(e) => setFilter(e.target.value)}>{categories.map((c) => <option key={c}>{c}</option>)}</select></div>
                <div className='field'><label htmlFor='sort'>Sort</label><select id='sort' value={sort} onChange={(e) => setSort(e.target.value)}><option value='newest'>Newest</option><option value='oldest'>Oldest</option><option value='az'>A to Z</option></select></div>
                <button className='btn-danger' type='button' onClick={clearAll}>Clear All</button>
              </div>

              <div className='list'>
                {visible.length === 0 ? <div className='empty'>No notes found for this filter.</div> : visible.map((n) => (
                  <article className='note' key={n.id}>
                    <div className='note-head'>
                      <div>
                        <h3>{n.title}</h3>
                        <p className='meta'>Created: {fmt(n.createdAt)}</p>
                        {n.updatedAt !== n.createdAt && <p className='meta'>Updated: {fmt(n.updatedAt)}</p>}
                      </div>
                    </div>
                    <div className='tags'><span className='tag'>{n.category}</span>{n.pinned && <span className='pin'>Pinned</span>}</div>
                    <p className='content'>{n.content}</p>
                    <div className='row'>
                      <button className='small btn-soft' onClick={() => edit(n)}>Edit</button>
                      <button className='small btn-soft' onClick={() => togglePin(n.id)}>{n.pinned ? 'Unpin' : 'Pin'}</button>
                      <button className='small btn-danger' onClick={() => remove(n.id)}>Delete</button>
                    </div>
                  </article>
                ))}
              </div>
            </section>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
